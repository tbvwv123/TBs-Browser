[package]
name = "tbs-browser"
version = "0.1.4"
edition = "2021"
publish = false

# unstable 기능(한 창에 여러 웹뷰)을 쓰므로 버전을 정확히 고정한다. 올릴 때는 0단계 시험을 다시 돌린다 (spec 11장 6번).
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell_Common",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 방문 기록과 다운로드 기록 (state\history.sqlite). SQLite를 함께 빌드한다.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# 자동 업데이트 (spec 5.7). GitHub Releases의 latest.json을 본다.
tauri-plugin-updater = "=2.14.0"
# 크롬 확장 zip 풀기 (spec 6.6). 업데이트 플러그인이 이미 쓰는 버전
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
# 광고 차단 엔진 (spec 6.7). Brave의 adblock-rust, MPL-2.0. 여러 스레드에서 쓰도록 single-thread 기능은 끈다
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
