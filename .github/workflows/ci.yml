# 로컬에서 돌리는 검사와 같다 (스모크 시험은 데스크톱 2와 WebView2 화면이 있어야 해서 뺀다)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.13.0
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:ui
      # Rust 빌드가 dist/를 넣으므로 cargo보다 먼저
      - run: npm run build:ui

      # rust-toolchain.toml과 같은 툴체인
      - run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: cargo test --manifest-path src-tauri/Cargo.toml
