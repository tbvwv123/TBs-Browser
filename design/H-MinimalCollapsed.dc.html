class Component extends DCLogic {
renderVals() {
const scrolled = !!(this.state && this.state.tabsScrolled);
return {
tabsLine: scrolled ? '#D0D0D0' : 'transparent',
onTabsScroll: (e) => {
const now = e.currentTarget.scrollTop > 0;
if (now !== scrolled) this.setState({ tabsScrolled: now });
}
};
}
