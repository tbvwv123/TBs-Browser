<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
componentDidMount() {
if (super.componentDidMount) super.componentDidMount();
this.measure();
}
measure() {
const l = this._list, h = this._hdr;
if (!l || !l.scrollHeight) return;
const s = { top: l.scrollTop / l.scrollHeight * 100, h: l.clientHeight / l.scrollHeight * 100, stuck: false };
if (h) s.stuck = l.scrollTop > 0 && h.getBoundingClientRect().top - l.getBoundingClientRect().top < 1;
this.setState(s);
}
renderVals() {
const st = this.state || {};
const open = !!st.menuOpen;
const bmOpen = st.bmOpen !== false;
const top = st.top ?? 0, h = st.h ?? 63;
if (!this._listRef) {
this._listRef = (el) => { if (el) this._list = el; };
this._hdrRef = (el) => { if (el) this._hdr = el; };
}
return {
menuOpen: open,
toggleMenu: () => this.setState({ menuOpen: !open }),
toggleBm: () => this.setState({ bmOpen: !bmOpen }, () => this.measure()),
bmDisplay: bmOpen ? 'flex' : 'none',
bmChevron: bmOpen ? '0deg' : '-90deg',
listRef: this._listRef,
hdrRef: this._hdrRef,
onListScroll: () => this.measure(),
thumbTop: top + '%',
thumbH: h + '%',
thumbOn: h < 99.5 ? 1 : 0,
tabsLine: st.stuck ? '#3E3E3E' : 'transparent'
};
}
}
