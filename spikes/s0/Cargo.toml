[package]
name = "tbs-s0-spike"
version = "0.0.0"
edition = "2021"
publish = false

# 0단계 기술 검증용. 본 기능 코드가 아니다. unstable 기능을 쓰므로 버전을 정확히 고정한다.
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri 2.12.5가 쓰는 것과 같은 버전으로 고정 (Cargo.lock에서 확인)
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
] }
